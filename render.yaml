# Render Static Site
# Dashboard: New → Static Site (or Blueprint with this file)
#
# Build Command:     echo ok
# Publish Directory: .
#
services:
  - type: web
    name: cg-vyapam-prep
    runtime: static
    branch: main
    buildCommand: echo ok
    staticPublishPath: .
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600
